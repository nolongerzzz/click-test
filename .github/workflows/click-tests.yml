name: click-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write   # required so replay.js can auto-file/comment on failures

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      # Where the app under test will be served. Include the path the harness
      # is wired into — the toolkit's own demo lives at /demo/.
      APP_URL: http://localhost:5173/demo/
      SERVE_ROOT: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # REPLACE the next two steps with however YOUR app builds and serves.
      # The defaults just serve this repo so the bundled demo works unchanged:
      #   build:  --if-present, so it no-ops when there is no build script
      #   serve:  the repo root, and set SERVE_ROOT/APP_URL above to match
      # ---------------------------------------------------------------------
      - name: Build app
        run: npm run build --if-present

      - name: Serve app in background
        # Output is redirected to a file on purpose: a background process that
        # keeps the step's stdout open can make the step hang until it times out.
        run: |
          npx serve "$SERVE_ROOT" -l 5173 > /tmp/serve.log 2>&1 &
          echo "$!" > /tmp/serve.pid

      - name: Wait for app to be ready
        run: npx wait-on -t 60000 "$APP_URL"

      - name: Replay click-test fixtures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          fixtures=(fixtures/*.json)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "No fixtures in fixtures/ — record one and commit it. Nothing to replay."
            exit 0
          fi
          # Run EVERY fixture even after one fails, so a single regression does
          # not hide the others (and every failure gets its issue filed).
          status=0
          for f in "${fixtures[@]}"; do
            echo "::group::$f"
            node replay/replay.js "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Server log
        if: failure()
        run: cat /tmp/serve.log || true
